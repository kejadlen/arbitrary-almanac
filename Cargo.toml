[package]
name = "arbitrary-almanac"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "arbitrary-almanac"
path = "src/bin/arbitrary-almanac/main.rs"

[dependencies]
almanac = { git = "https://github.com/ivy/almanac", branch = "alpha/main" }
almanac-renovate = { git = "https://github.com/ivy/almanac", branch = "alpha/main" }
clap = { version = "*", features = ["derive", "env"] }
clap_complete = "*"
fs-err = "*"
futures = "*"
github = { git = "https://github.com/ivy/almanac", branch = "alpha/main" }
miette = { version = "*", features = ["fancy"] }
mlua = { version = "*", features = ["lua54", "vendored", "async", "send", "serde"] }
serde = { version = "*", features = ["derive"] }
serde_json = "*"
thiserror = "*"
tokio = { version = "*", features = ["full"] }
tracing = "*"
tracing-subscriber = { version = "*", features = ["env-filter"] }

[dev-dependencies]
assert_cmd = "*"
hegeltest = { version = "*", default-features = false, features = ["static-engine"] }
jiff = "*"
predicates = "*"
simforge = { git = "https://github.com/ivy/almanac", branch = "alpha/main" }
tempfile = "*"

[lints.clippy]
self_named_module_files = "warn"
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
indexing_slicing = "warn"
arithmetic_side_effects = "warn"
