[package]
name = "arbitrary-almanac"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "arbitrary-almanac"
path = "src/bin/arbitrary-almanac/main.rs"

[dependencies]
clap = { version = "*", features = ["derive", "env"] }
clap_complete = "*"
fs-err = "*"
miette = { version = "*", features = ["fancy"] }
thiserror = "*"
tokio = { version = "*", features = ["full"] }
tracing = "*"
tracing-subscriber = { version = "*", features = ["env-filter"] }

[dev-dependencies]
assert_cmd = "*"
hegeltest = "*"
predicates = "*"
tempfile = "*"

[lints.clippy]
self_named_module_files = "warn"
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
indexing_slicing = "warn"
arithmetic_side_effects = "warn"
